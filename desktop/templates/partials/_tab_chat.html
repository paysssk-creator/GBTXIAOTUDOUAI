                <div class="tab-panel" id="panel-chat">
                    <div class="card" style="height:calc(100vh - 160px);display:flex;flex-direction:column">
                        <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
                            <span>智能 对话</span>
                            <span id="chat-auth-tip"
                                style="font-size:10px;color:var(--t3);margin-left:auto;margin-right:12px">未登录，当前扣费走访客余额</span>
                            <label style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer">
                                <input type="checkbox" id="deep-mode" style="accent-color:var(--brand-primary)">
                                深度推理 (DeepSeek-R1)
                            </label>
                        </div>
                        <div class="card-body" style="flex:1;overflow-y:auto;padding:12px" id="chat-messages">
                            <div class="chat-msg assistant">
                                <div class="msg-avatar">智</div>
                                <div class="msg-bubble">
                                    <div class="msg-text">你好！我是 GBT Pro AI助手，搭载 DeepSeek 最强推理大模型。<br><br>勾选「深度推理」可使用 R1
                                        思维链模式获得更专业的分析。</div>
                                </div>
                            </div>
                        </div>
                        <div
                            style="padding:8px 12px;border-top:1px solid var(--b);display:flex;gap:8px;align-items:flex-end">
                            <textarea id="chat-input" placeholder="输入消息..."
                                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"
                                style="flex:1;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:10px;resize:none;font:12px Segoe UI;height:48px;min-height:48px;max-height:120px"></textarea>
                            <button onclick="sendChat()"
                                style="padding:10px 20px;background:var(--brand-primary);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap;height:48px">
                                发送
                            </button>
                        </div>
                    </div>
                </div>
