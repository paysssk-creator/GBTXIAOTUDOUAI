                <div class="tab-panel" id="panel-connect">
                    <div class="card">
                        <div class="card-header">连接大模型<span class="st">配置 API Key</span></div>
                        <div class="card-body">
                            <div style="margin-bottom:10px"><label
                                    style="font-size:11px;color:var(--t3);display:block;margin-bottom:4px">模型提供商</label>
                                <select id="cfg-provider"
                                    style="width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px;font-size:12px">
                                    <option value="zhipu">智谱 智能 (GLM-4)</option>
                                    <option value="deepseek">DeepSeek</option>
                                    <option value="openai">OpenAI</option>
                                    <option value="qwen">通义千问</option>
                                    <option value="hunyuan">腾讯混元</option>
                                </select>
                            </div>
                            <label style="font-size:11px;color:var(--t3);display:block;margin-bottom:4px">API
                                Key</label>
                            <input id="cfg-apikey" type="password" placeholder="输入你的 API Key..."
                                style="width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px;font-size:12px;margin-bottom:10px">
                            <label style="font-size:11px;color:var(--t3);display:block;margin-bottom:4px">模型
                                (可选)</label>
                            <input id="cfg-model" placeholder="默认自动选择"
                                style="width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px;font-size:12px;margin-bottom:14px">
                            <button class="save" onclick="saveLLM()"
                                style="width:100%;padding:10px;background:var(--a);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px">保存并连接</button>
                        </div>
                    </div>
                </div>
