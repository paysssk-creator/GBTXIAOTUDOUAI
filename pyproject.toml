[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbt-agent-framework"
version = "1.5.1"
description = "GBT全能开发者 — AI原生Agent框架 | A股自主交易终端"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "GBTxiaotudou", email = "paysssk-creator@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    # === synced with requirements.txt v1.6 ===
    # Core
    "openai>=1.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31,<3.0.0",
    "flask>=3.0,<4.0.0",
    "aiohttp>=3.9",
    # Desktop / Controls
    "psutil>=5.9,<7.0.0",
    "pyautogui>=0.9,<1.0.0",
    "pyperclip>=1.8,<2.0.0",
    "keyboard>=0.13",
    "Pillow>=10.0,<12.0.0",
    # Voice / Audio
    "edge-tts>=6.1",
    "SpeechRecognition>=3.10,<5.0.0",
    "pycaw>=20240210",
    "pyttsx3>=2.90,<3.0.0",
    # Bluetooth / BLE
    "bleak>=0.21",
    # COM Interop (Windows)
    "comtypes>=1.4",
    "pywin32>=306",
    # Data / Analysis
    "numpy>=1.26",
    "pandas>=2.2",
    # Web / Scraping
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
ocr = [
    "opencv-python>=4.8",
    "rapidocr_onnxruntime>=1.2",
    "easyocr>=1.7",
    "pytesseract>=0.3",
]
browser = [
    "playwright>=1.45",
]
build = [
    "pyinstaller>=6.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/paysssk-creator/GBTXIAOTUDOUAI"
Repository = "https://github.com/paysssk-creator/GBTXIAOTUDOUAI"

[project.scripts]
gbt = "gbt.cli:main"
gbt-desktop = "desktop.app:main"

[tool.setuptools.packages.find]
include = ["gbt*", "agents*", "tools*", "desktop*"]

[tool.pyright]
exclude = [
    ".venv",
    "venv",
    "**/__pycache__",
    "build",
    "build_*",
    "dist",
    "dist_*",
    "screenshots",
]

