<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><title>GBT Pro — 市场</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,system-ui,sans-serif;background:#0a0e14;color:#e6e8ec}
.hdr{background:#11161e;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a2230}
.hdr h1{font-size:15px;color:#6366f1}
.nav a{color:#8b949e;text-decoration:none;padding:4px 10px;border-radius:4px;font-size:11px}
.nav a.on{background:#6366f1;color:#fff}
.main{display:grid;grid-template-columns:1fr 320px;gap:8px;padding:8px;height:calc(100vh - 40px)}
.pn{background:#11161e;border:1px solid #1a2230;border-radius:6px;overflow:hidden}
.ph{font-size:10px;color:#8b949e;padding:8px 12px;border-bottom:1px solid #1a2230;letter-spacing:.5px}
.idx{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1a2230}
.ic{background:#11161e;padding:12px}.in{font-size:10px;color:#8b949e}.ip{font-size:20px;font-weight:700;margin:2px 0}.icg{font-size:11px}.up{color:#22c55e}.dn{color:#ef4444}
.wl{overflow-y:auto;max-height:calc(100% - 80px)}
.wr{display:grid;grid-template-columns:1fr 65px 75px 50px;padding:7px 12px;font-size:12px;border-bottom:1px solid #151b24;align-items:center;cursor:pointer}
.wr:hover{background:#151b24}.wc{font-size:10px;color:#8b949e}
.lkp{padding:8px 12px;display:flex;gap:4px}
.inp{background:#0a0e14;border:1px solid #1a2230;color:#e6e8ec;padding:5px 8px;border-radius:3px;font-size:11px;width:80px}
.bt{background:#6366f1;color:#fff;border:none;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:11px}.bt:hover{background:#5558e6}
.st{text-align:center;color:#8b949e;padding:20px;font-size:11px}
</style></head><body>
<div class="hdr"><h1>GBT Pro</h1><div class="nav"><a href="/dashboard">仪表盘</a><a href="/market" class="on">市场</a></div><span style="margin-left:auto;font-size:10px;color:#8b949e" id="clk"></span></div>
<div class="main">
<div class="pn"><div class="ph">指数</div><div class="idx" id="idx"><div class="st">加载中...</div></div></div>
<div class="pn"><div class="ph">自选股</div>
<div class="lkp"><input class="inp" id="cd" placeholder="代码"><button class="bt" onclick="addW()">+</button><button class="bt" style="background:#ef4444" onclick="clearW()">清</button></div>
<div class="wl" id="wl"><div class="st">加载中...</div></div></div></div>
<script>
const $=s=>document.querySelector(s);
let w=JSON.parse(localStorage.getItem('gbt_watch')||'["600519","000858","300750","601318","600036","000333","002594","688981","601012","600276"]');

async function api(u){try{const r=await fetch(u);return await r.json()}catch(e){return{}}}
function f(n,d=2){return Number(n||0).toFixed(d)}

async function load(){
  $('#'+'clk').textContent=new Date().toLocaleTimeString('zh-CN');
  const m=await api('/api/market');
  if(m.indices){let h='';m.indices.forEach(i=>{const u=i.pct>=0;h+=`<div class="ic"><div class="in">${i.name}</div><div class="ip">${f(i.price)}</div><div class="icg ${u?'up':'dn'}">${u?'+':''}${f(i.change)} (${u?'+':''}${f(i.pct)}%)</div></div>`});$('#'+'idx').innerHTML=h}

  let wh='';
  for(let c of w){
    try{const p=c.startsWith('6')?'1':'0';const r=await fetch(`https://push2.eastmoney.com/api/qt/stock/get?fields=f43,f58,f170,f47&secid=${p}.${c}`);const d=await r.json();const s=d.data||{};
      const pr=s.f43/100;const chg=s.f170/100;const pct=chg&&pr?((chg/(pr-chg))*100):0;const u=chg>=0;
      wh+=`<div class="wr"><div><span>${s.f58||c}</span><br><span class="wc">${c}</span></div><div style="font-weight:600">${f(pr)}</div><div class="${u?'up':'dn'}">${u?'+':''}${f(chg)}<br><span style="font-size:9px">${u?'+':''}${f(pct)}%</span></div><div style="font-size:9px;color:#8b949e">${((s.f47||0)/10000).toFixed(0)}万</div></div>`;
    }catch(e){}
  }
  $('#'+'wl').innerHTML=wh||'<div class="st">无数据</div>';
}

function addW(){const c=$('#'+'cd').value.trim();if(c&&!w.includes(c)){w.unshift(c);saveW()}}
function clearW(){w=[];saveW()}
function saveW(){localStorage.setItem('gbt_watch',JSON.stringify(w));load()}

load();setInterval(load,10000);
</script></body></html>
