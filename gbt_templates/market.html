<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GBT Pro — 市场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e14;color:#e6e8ec;min-height:100vh}
.header{background:#11161e;padding:10px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #1a2230}
.header h1{font-size:16px;color:#6366f1}
.nav{display:flex;gap:4px}
.nav a{color:#8b949e;text-decoration:none;padding:5px 12px;border-radius:6px;font-size:12px}
.nav a.active{background:#6366f1;color:#fff}
.main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;height:calc(100vh - 46px)}
.panel{background:#11161e;border-radius:8px;border:1px solid #1a2230;overflow:hidden}
.panel-hd{font-size:11px;color:#8b949e;padding:10px 14px;border-bottom:1px solid #1a2230;text-transform:uppercase;letter-spacing:.5px}
.idx-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1a2230}
.idx-card{background:#11161e;padding:14px}
.idx-name{font-size:11px;color:#8b949e}
.idx-price{font-size:22px;font-weight:700;margin:4px 0;color:#e6e8ec}
.idx-chg{font-size:12px}.up{color:#22c55e}.down{color:#ef4444}
.wlist{overflow-y:auto;max-height:calc(100% - 30px)}
.wl-row{display:grid;grid-template-columns:1fr 70px 80px 60px;padding:8px 14px;font-size:13px;border-bottom:1px solid #151b24;align-items:center;cursor:pointer}
.wl-row:hover{background:#151b24}
.wl-code{font-size:11px;color:#8b949e}.wl-name{font-size:13px}
.heat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px}
.heat-tag{background:#151b24;padding:8px 10px;border-radius:6px;font-size:12px;display:flex;justify-content:space-between}
.tag-name{color:#8b949e}.tag-pct{font-weight:600}
.input{background:#0a0e14;border:1px solid #1a2230;color:#e6e8ec;padding:7px 10px;border-radius:4px;font-size:12px;width:100px}
.btn{background:#6366f1;color:#fff;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-size:12px}.btn:hover{background:#5558e6}
.lookup{padding:12px}
.result{padding:0 12px 12px;font-size:12px}
.status{padding:20px;text-align:center;color:#8b949e;font-size:12px}
.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
<div class="header"><h1>GBT Pro</h1>
<div class="nav"><a href="/dashboard">仪表盘</a><a href="/market" class="active">市场</a></div>
<span style="margin-left:auto;font-size:11px;color:#8b949e" id="clock"></span></div>

<div class="main">
<div class="panel" id="left">
<div class="panel-hd">市场指数</div>
<div class="idx-grid" id="indices"><div class="status"><span class="spin">◌</span> 加载中...</div></div>
<div class="panel-hd" style="margin-top:12px">热门概念</div>
<div class="heat-grid" id="hot"><div class="status">加载中...</div></div>
</div>
<div class="panel" id="right">
<div class="panel-hd">自选股</div>
<div class="lookup"><div style="display:flex;gap:6px">
<input class="input" id="code" placeholder="代码" value="600519"><input class="input" id="code2" placeholder="代码" value="000858"><button class="btn" onclick="addWatch()">+加</button></div></div>
<div class="wlist" id="watch"><div class="status">加载中...</div></div>
</div></div>

<script>
const WATCH=['600519','000858','300750','601318','600036','000333','002594','688981','601012','600276'];
let prices={};

async function api(u){try{const r=await fetch(u);return await r.json()}catch(e){return{}}}
function f(n,d=2){return Number(n||0).toFixed(d)}

async function fetchPrice(code){
  const p=code.startsWith('6')?'1':'0';
  const r=await fetch(`https://push2.eastmoney.com/api/qt/stock/get?fields=f43,f44,f45,f46,f47,f48,f50,f57,f58,f60,f170,f116&secid=${p}.${code}`);
  const d=await r.json(); const s=d.data||{};
  return {code,name:s.f58||code,price:s.f43||0,change:s.f170||0,high:s.f44||0,low:s.f45||0,open:s.f46||0,prev:s.f60||0,vol:s.f47||0,turnover:s.f48||0,pe:s.f116||0};
}

async function loadAll(){
  $('#'+'clock').textContent=new Date().toLocaleTimeString('zh-CN');
  const market=await api('/api/market');
  if(market.indices){
    let h='';
    market.indices.forEach(i=>{const u=i.pct>=0;h+=`<div class="idx-card"><div class="idx-name">${i.name}</div><div class="idx-price">${f(i.price)}</div><div class="idx-chg ${u?'up':'down'}">${u?'+':''}${f(i.change)} (${u?'+':''}${f(i.pct)}%)</div></div>`});
    $('#'+'indices').innerHTML=h;
  }

  let wh='';
  for(const c of WATCH){
    try{const s=await fetchPrice(c);prices[c]=s;
      const u=s.change>=0;const pct=s.prev?(s.change/s.prev*100):0;
      wh+=`<div class="wl-row"><div><span class="wl-name">${s.name}</span><br><span class="wl-code">${c}</span></div><div style="font-weight:700">${f(s.price)}</div><div class="${u?'up':'down'}">${u?'+':''}${f(s.change)}<br><span style="font-size:10px">${u?'+':''}${f(pct)}%</span></div><div class="sub" style="font-size:10px;color:#8b949e">量:${(s.vol/10000).toFixed(0)}万</div></div>`;
    }catch(e){}
  }
  $('#'+'watch').innerHTML=wh||'<div class="status">无数据</div>';

  // 热门概念
  $('#'+'hot').innerHTML=[{n:'AI芯片',p:3.2},{n:'新能源',p:-1.5},{n:'半导体',p:2.8},{n:'白酒',p:0.6},{n:'医药',p:-0.8},{n:'机器人',p:4.1}].map(t=>`<div class="heat-tag"><span class="tag-name">${t.n}</span><span class="tag-pct ${t.p>=0?'up':'down'}">${t.p>=0?'+':''}${t.p}%</span></div>`).join('');
}

function addWatch(){
  const c=$('#'+'code').value.trim();
  if(c&&!WATCH.includes(c)){WATCH.unshift(c);loadAll()}
}

const $=s=>document.querySelector(s);
loadAll();setInterval(loadAll,15000);
</script></body></html>
